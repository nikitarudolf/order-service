name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Analyze with SonarQube Cloud
        if: >-
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar
          -Dsonar.organization=nikitarudolf
          -Dsonar.projectKey=nikitarudolf_order-service
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.java.jdkHome="$JAVA_HOME"

      - name: Build Docker image
        run: docker build -t order-service:${{ github.sha }} .

      - name: Save Docker image
        run: docker save order-service:${{ github.sha }} -o order-service.tar

      - uses: actions/upload-artifact@v4
        with:
          name: order-service-image
          path: order-service.tar
