name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Build Docker image
        run: docker build -t order-service:${{ github.sha }} .

      - name: Save Docker image
        run: docker save order-service:${{ github.sha }} -o order-service.tar

      - uses: actions/upload-artifact@v4
        with:
          name: order-service-image
          path: order-service.tar
