server:
  port: 8083

spring:
  application:
    name: order-service
  profiles:
    default: local
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
jwt:
  secret: ${JWT_SECRET}
services:
  user-url: ${USER_SERVICE_URL:http://localhost:8080}